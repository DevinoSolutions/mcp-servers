<!-- The Demofy favicon: the "d" app mark (web/public/demofy-mark.svg — the source of truth,
     brand round 3, 2026-08-21) on the app's own dark tile. Geometry is verbatim from the locked
     file; do not redraw. It replaced the emerald pointer glyph (brand round 2) on 2026-08-21.

     The TILE is the fleet convention (BioFlow's icon.svg, uNotes' icon.svg): the mark's glyph is
     near-white #E3E5E4, invisible on a light tab strip, so it sits on a rounded-square of the app
     ground — #0A0A0A, the globals.css bg token, repeated here because a favicon is a standalone document
     the token sheet cannot reach. The tile reads on light AND dark tab strips, which is why no
     prefers-color-scheme swap is needed inside the file.

     Static SVG rather than a generated icon route: a favicon should never be a build-time render
     that can fail, and an SVG favicon stays crisp at every size a browser asks for. The raster
     set (favicon.ico, apple-icon.png, icon/maskable PNGs) is generated FROM this file by
     scripts/generate-brand-icons.mjs and committed; tests/brandicons.test.ts pins this file's
     outlines against web/app/components/mark.ts so the two cannot drift.

     Mark placement: scale 3 → 384×378 (75% of the tile), centered: x (512−384)/2 = 64,
     y (512−378)/2 = 67. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Demofy">
  <rect width="512" height="512" rx="115" fill="#0A0A0A"/>
